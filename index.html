<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Паласантович — Кошачья Галерея</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 95px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .logo-link {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-block;
      line-height: 0;
      z-index: 10;
    }

    .header-logo {
      height: 65px;         
      width: auto;          
      display: block;       
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    .header-text {
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;   
      align-items: center; 
    }

    /* Настройки заголовка с эффектом пульсирующего неонового свечения */
    header h1 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.2; /* Для крупных заголовков в шапке интервал чуть меньше */
      text-align: left;
      color: #ffffff;
      text-transform: uppercase; /* Делает все буквы заглавными */
      letter-spacing: 1px;       /* Немного раздвигает буквы для красоты */
      animation: neon-pulse 2s infinite alternate ease-in-out; /* Запускает пульсацию */
    }

    /* Эффект плавного пульсирующего свечения (голубой неон под цвет сайта) */
    @keyframes neon-pulse {
      from {
        text-shadow: 
          0 0 4px rgba(255, 255, 255, 0.9),
          0 0 10px rgba(52, 152, 219, 0.6),
          0 0 20px rgba(52, 152, 219, 0.4);
      }
      to {
        text-shadow: 
          0 0 8px rgba(255, 255, 255, 1),
          0 0 20px rgba(52, 152, 219, 0.9),
          0 0 35px rgba(52, 152, 219, 0.7),
          0 0 50px rgba(52, 152, 219, 0.5);
      }
    }

    /* Навигация (вкладки) */
    nav {
      background-color: #34495e;
      padding: 10px 0;
      text-align: center;
    }
    
    nav button {
      background: none;
      border: none;
      color: white;
      margin: 0 15px;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      padding: 5px 0;
      position: relative;
      font-family: inherit;
    }

    nav button::after {
      content: '';
      position: absolute;
      width: 100%;
      transform: scaleX(0);
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: var(--accent-color);
      transition: transform 0.3s ease-out;
    }

    nav button:hover::after, nav button.active::after {
      transform: scaleX(1);
    }

    main.container {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* Скрытие неактивных вкладок */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 25px; 
      text-align: center;
    }

    .section h2 {
      color: var(--primary-color);
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
      text-align: left;
    }

    /* Главная страница (один кот) */
    .main-cat-container {
      max-width: 500px;
      margin: 0 auto;
    }

    .cat-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: zoom-in; /* Курсор-лупа при наведении */
    }

    .cat-description {
      margin-top: 15px;
      font-style: italic;
      color: #555;
    }

    /* Сетка Галереи */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .gallery-item {
      background: var(--bg-color);
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
    }

    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      cursor: zoom-in; /* Курсор-лупа при наведении */
    }

    /* Стили для модального окна (разворачивание фото) */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 9999; 
      padding-top: 50px; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      overflow: auto; 
      background-color: rgba(0, 0, 0, 0.9); 
      cursor: zoom-out;
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
      animation: zoomIn 0.25s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: var(--accent-color);
    }

    footer {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: auto;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      header { padding: 15px; flex-direction: column; }
      .logo-link { position: static; transform: none; margin-bottom: 10px; }
      header h1 { font-size: 1.2rem; }
      .gallery-grid { grid-template-columns: 1fr; }
      .modal-close { right: 20px; top: 10px; }
    }
  </style>
</head>

  </div>

  <!-- JavaScript сценарии -->
  <script>
    // Функция переключения вкладок
    function openTab(tabId) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));
      
      const buttons = document.querySelectorAll('nav button');
      buttons.forEach(button => button.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      document.getElementById('btn-' + tabId).classList.add('active');
    }

    // Логика разворачивания фото во весь экран
    const modal = document.getElementById('catModal');
    const modalImg = document.getElementById('modalImg');

    // Навешиваем событие клика на все изображения котов
    document.querySelectorAll('.cat-img, .gallery-item img').forEach(img => {
      img.addEventListener('click', function() {
        modal.style.display = "block";
        modalImg.src = this.src;
      });
    });

    // Функция закрытия окна
    function closeModal() {
      modal.style.display = "none";
    }
  </script>
